# Pytest configuration for discord-guildmaster-mcp
#
# Phase: DDD Phase 2 - Test Suite Implementation
# Generated: 2025-12-23

[pytest]
# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Minimum Python version
minversion = 7.0

# Additional command line options
addopts =
    # Verbose output
    -v
    # Show local variables in tracebacks
    -l
    # Show summary of all test outcomes
    -ra
    # Strict markers (fail on unknown markers)
    --strict-markers
    # Strict config (fail on unknown config options)
    --strict-config
    # Show warnings
    -W default
    # Doctest modules
    --doctest-modules
    # Coverage (when --cov flag used)
    --cov-branch
    --cov-report=term-missing:skip-covered
    --cov-report=html

# Markers for categorizing tests
markers =
    unit: Unit tests (fast, heavily mocked)
    integration: Integration tests (slower, may require external services)
    comfyui: Tests requiring ComfyUI server
    slow: Known slow tests (>5 seconds)
    
    # Tool category markers
    guild: Guild information tools
    members: Member management tools
    roles: Role operation tools
    channels: Channel management tools
    messages: Messaging tools
    webhooks: Webhook management tools
    forums: Forum support tools
    threads: Thread management tools
    utility: Utility tools
    
    # System markers
    config: Configuration tests
    theming: Theming system tests
    workflows: Multi-agent workflow tests
    chronicler: The Chronicler integration tests

# Asyncio configuration
asyncio_mode = auto

# Coverage configuration
[coverage:run]
source = discord_guildmaster_mcp
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */site-packages/*
    */venv/*
    */virtualenv/*

[coverage:report]
# Fail if coverage below threshold
fail_under = 80

# Don't report files with 100% coverage
skip_covered = True

# Show lines that weren't covered
show_missing = True

# Precision for coverage percentage
precision = 2

# Exclude lines from coverage
exclude_lines =
    # Standard pragmas
    pragma: no cover
    
    # Don't complain about missing debug code
    def __repr__
    def __str__
    
    # Don't complain if tests don't hit defensive assertion code
    raise AssertionError
    raise NotImplementedError
    
    # Don't complain if non-runnable code isn't run
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    if typing.TYPE_CHECKING:
    @abstractmethod
    @abc.abstractmethod
    
    # Don't complain about pass statements
    pass
    
    # Don't complain about ellipsis for type stubs
    \.\.\.

[coverage:html]
directory = htmlcov

# Logging configuration (for pytest --log-cli-level)
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = tests/logs/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# Console output
console_output_style = progress

# Timeout for tests (requires pytest-timeout)
timeout = 300
timeout_method = thread

# Parallel execution (requires pytest-xdist)
# Run with: pytest -n auto
# addopts = -n auto

